name: Scheduled data refresh
# Refreshes all authoritative snapshots, re-runs validation and the walk-forward
# evaluation, and commits the results only if every gate passes. Invalid upstream
# data therefore never reaches production, and each refresh is an auditable commit.
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run data:validate
      - run: npm run models:evaluate
      - run: npm test
      - name: Commit refreshed snapshots
        run: |
          git config user.name "debtscope-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ MODEL_COMPARISON.csv
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "data: scheduled refresh of official snapshots and evaluation artifact"
            git push
          fi
